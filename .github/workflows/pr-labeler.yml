name: PR labeler

# pull_request_target (not pull_request): runs with the base repo's token and permissions even for
# a pull request opened from a fork, which pull_request would deny by default. It does NOT check out
# or execute the PR's own code -- release-drafter only reads the PR's title/branch/changed-file list
# through the GitHub API, never anything from the fork's working tree.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write   # release-drafter creates a label the first time it applies one that doesn't exist yet

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autolabel:
    runs-on: ubuntu-latest
    steps:
      - name: Autolabel from title / branch / changed files
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
