name: tests
on:
  push:
    branches: [main]
  pull_request:
  # ffmpeg-skill releases independently and often: run against its current main every day, so a release that breaks
  # this skill shows up even when nothing here changed (there is no version window to hide behind, ADR-19)
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch: {}
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ffmpeg-skill ${{ matrix.ffmpeg_skill_label }}
    strategy:
      fail-fast: false
      matrix:
        # every platform runs against ffmpeg-skill main (the newest release); one Linux job keeps the oldest commit
        # this skill is verified against (ffmpeg-skill 0.12.3: --crf, a single _common.py, probe's 1.x `hdr`), so
        # both ends of the detected-capability range stay covered. ffmpeg-skill 3.0 requires Python 3.10+, so the
        # Python 3.9 job runs the last 2.x (2.24.1, pinned by commit) and 3.0.0 has its own job (ADR-21)
        include:
          - os: ubuntu-latest
            python: "3.9"
            ffmpeg_skill_ref: a2c8433b2441b52b4fe16ce3525100d892ee047f
            ffmpeg_skill_label: "2.24.1 (last 2.x, Python 3.9)"
          - os: ubuntu-latest
            python: "3.11"
            ffmpeg_skill_ref: 1dc2f52013956daa1d97fd9d9d53c79b9305bc43
            ffmpeg_skill_label: "3.0.0"
          - os: ubuntu-latest
            python: "3.11"
            ffmpeg_skill_ref: main
            ffmpeg_skill_label: main
          - os: windows-latest
            python: "3.11"
            ffmpeg_skill_ref: main
            ffmpeg_skill_label: main
          - os: macos-latest
            python: "3.11"
            ffmpeg_skill_ref: main
            ffmpeg_skill_label: main
          - os: ubuntu-latest
            python: "3.11"
            ffmpeg_skill_ref: c3a4a5f0ef6629018308a7eaeb5a1f592e5defc1
            ffmpeg_skill_label: "0.12.3 (oldest supported)"
    # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build; keep 3.9 on the newest image that does
    runs-on: ${{ matrix.python == '3.9' && startsWith(matrix.os, 'ubuntu') && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Fetch ffmpeg-skill (${{ matrix.ffmpeg_skill_label }})
        env:
          FFMPEG_SKILL_REF: ${{ matrix.ffmpeg_skill_ref }}
        run: |
          git clone https://github.com/kajisho5/ffmpeg-skill vendor/ffmpeg-skill
          git -C vendor/ffmpeg-skill checkout "$FFMPEG_SKILL_REF"
          echo "ffmpeg-skill $(git -C vendor/ffmpeg-skill rev-parse HEAD) $(grep -m1 '"version"' vendor/ffmpeg-skill/package.json)"
        shell: bash
      - run: ffprobe -version
        shell: bash
      - run: python -m pip install -e . pytest pyflakes
      - run: python -m pyflakes src tests
      - run: python -m pytest -q
        env:
          COLOR_GRADING_FFMPEG_SKILL_DIR: ${{ github.workspace }}/vendor/ffmpeg-skill
      - run: color-grading doctor --json --ffmpeg-skill vendor/ffmpeg-skill
        shell: bash
      - run: color-grading skill --json > contract.json
        shell: bash
      - run: python -c "import json; json.load(open('contract.json'))"
