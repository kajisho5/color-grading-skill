[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "color-grading-skill"
version = "1.0.0"
description = "Deterministic colour grading / colour correction execution Skill (HDR-to-SDR tone mapping, 3D LUT application, colour-tag retagging, Dolby Vision RPU removal, typed primary colour correction) on top of ffmpeg-skill. Not an AI agent."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["color", "colour", "color-grading", "ffmpeg", "hdr", "lut", "skill"]
dependencies = []

[project.optional-dependencies]
# OCIO_TRANSFORM (docs/decisions.md ADR-22): PyOpenColorIO, BSD-3-Clause; 2.3 is the first release with the built-in
# ACES studio config (ocio://studio-config-latest)
ocio = ["opencolorio>=2.3"]

[project.scripts]
color-grading = "color_grading.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/color-grading-skill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = false
warn_unused_ignores = false
